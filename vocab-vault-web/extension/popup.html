<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo"></div>
      <span class="title">Vocab Vault</span>
    </div>
    <button id="openAppBtn" class="btn-xs">Open App</button>
  </div>

  <div class="add-box">
    <input type="text" id="manualInput" placeholder="Enter word (e.g. serendipity)" autocomplete="off">
    <select id="langSelect" aria-label="Language">
      <option value="en">EN</option>
      <option value="ja">JA</option>
      <option value="fr">FR</option>
      <option value="de">DE</option>
      <option value="es">ES</option>
      <option value="it">IT</option>
      <option value="pt">PT</option>
      <option value="nl">NL</option>
      <option value="zh">ZH</option>
      <option value="ko">KO</option>
    </select>
    <button id="addBtn" class="btn-add">Add</button>
  </div>

  <div class="section-title">
    <span><span id="sectionLabel">Collected Words</span> (<span id="queueCount">0</span>)</span>
    <div class="sec-actions">
      <button id="copyAllBtn" class="btn-link">Copy All</button>
      <button id="clearBtn" class="btn-link">Clear</button>
    </div>
  </div>

  <div id="queueList" class="queue-list"></div>

  <div class="footer">
    <span id="footerHint">Select any word while browsing to save in 1 tap</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
