name: Daily Etymology Automated Marketing Bot

on:
  schedule:
    # Runs at 23:00 UTC every day (= 08:00 JST next morning)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  post-daily-root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Daily Etymology Bot
        run: |
          python3 scripts/daily_etymology_bot.py

      - name: Commit and Push Daily Archive
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add docs/marketing/daily/
          git diff-index --quiet HEAD || git commit -m "chore(marketing): archive daily etymology viral post"
          git push
